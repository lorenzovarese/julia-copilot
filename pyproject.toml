[project]
name = "julia-copilot"
version = "0.2.0"
description = "Fine-tuning and benchmarking of small language models for Julia code completion."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Arnaud Fauconnet" },
    { name = "Lorenzo Varese" },
    { name = "Vittorio Perozzi" },
]
keywords = ["julia", "code-completion", "llm", "fine-tuning", "humaneval"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Private :: Do Not Upload",
]

dependencies = [
    "datasets>=3.2.0",
    "pandarallel>=1.6.5",
    "pandas>=2.2.3",
    "statsmodels>=0.14.4",
    "tqdm>=4.67.1",
    "transformers>=4.48.0",
    "tree-sitter>=0.23.2",
    "tree-sitter-julia>=0.23.1",
]

[project.optional-dependencies]
# Everything needed to actually train or query a model. Kept optional so that
# the parsing / dataset-building half of the pipeline stays installable on a
# machine without a GPU (and without pulling ~2 GB of CUDA wheels).
train = [
    "accelerate>=1.3.0",
    "bitsandbytes>=0.45.0",
    "peft>=0.14.0",
    "torch>=2.5.1",
    "trl>=0.13.0",
]

[project.scripts]
julia-copilot = "julia_copilot.cli:main"

[project.urls]
Repository = "https://github.com/lorenzovarese/julia-copilot"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/julia_copilot"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["benchmark/results", "data", "MultiPL-E"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "ARG",  # unused arguments
    "PL",   # pylint
    "RUF",  # ruff-specific rules
]
ignore = [
    "PLR0912",  # too many branches: the parsers are inherently branchy
    "PLR0913",  # too many arguments: pipeline stages take many knobs
    "PLR0915",  # too many statements
    "PLR2004",  # magic values are fine in parsing heuristics
    # Imports of torch/transformers/trl/tree-sitter are deliberately deferred
    # into the functions that need them, so that `julia-copilot --help` is
    # instant and the parsing stages run on a machine with no CUDA stack.
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["julia_copilot"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
